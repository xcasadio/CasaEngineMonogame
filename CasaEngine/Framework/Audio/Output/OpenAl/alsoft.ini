# The engine ships this file beside each executable (ADR-0094). OpenAL Soft reads it after %AppData%\alsoft.ini and before the file named by ALSOFT_CONF.
# It asks for a 2 x 480 frame device buffer (10 ms periods at 48 kHz); on Windows shared mode the system grants the final size.
[general]
period_size = 480
periods = 2
